name: Verify

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    - name: Install tools
      run: |
        go install mvdan.cc/gofumpt@v0.8.0
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Lint
      run: make lint

    - name: Build
      run: make build

    - name: Test
      run: make test

    - name: Race test
      run: make test-race

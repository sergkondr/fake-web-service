apiVersion: v1
kind: ConfigMap
metadata:
  name: fakesvc-config
data:
  config.yaml: |
    metrics:
      enabled: true
      path: /metrics
    
    endpoints:
      - name: echo
        type: ws/echo
        description: Basic WebSocket echo endpoint
        path: /ws/echo
      - name: time
        type: ws/stream
        description: Sends the current time every second
        path: /ws/time
        stream:
          interval: 1s
          format: json
      - name: Good endpoint
        type: http
        description: Fast enough, no errors at all
        path: /good
        chaos:
          error_rate: 0.0
          latency:
            min: 10ms
            p95: 50ms
            max: 100ms
      - name: Bad endpoint
        type: http
        description: 30% of requests fails with 500 error
        path: /bad
        chaos:
          error_rate: 0.3
          latency:
            min: 300ms
            p95: 3500ms
            max: 5s
      - name: Slow good endpoint
        type: http
        description: Always slow, but no errors
        path: /slow
        chaos:
          error_rate: 0.0
          latency:
            min: 1s
            p95: 5s
            max: 10s
      - name: Proxy endpoint
        type: proxy
        description: Sends requests to an upstream backend with configurable chaos
        path: /your-service
        backend:
          url: https://service.example.com/api/v1
          timeout: 10s
          preserve_host: false
        chaos:
          error_rate: 0.5
          latency:
            min: 1s
            p95: 5s
            max: 10s

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fakesvc
  name: fakesvc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fakesvc
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app: fakesvc
    spec:
      containers:
      - image: sergkondr/fakesvc:dev
        imagePullPolicy: Always
        name: fakesvc
        command:
        - /app/fakesvc
        args:
        - --debug
        - --config
        - /app/config.yaml
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        livenessProbe:
          tcpSocket:
            port: 8080
        readinessProbe:
          httpGet:
            port: 8080
            path: /healthz
        volumeMounts:
        - name: fakesvc-config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: fakesvc-config
        configMap:
          name: fakesvc-config
---
apiVersion: v1
kind: Service
metadata:
  name: fakesvc
spec:
  selector:
    app: fakesvc
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fakesvc
spec:
  ingressClassName: nginx
  rules:
  - host: fakesvc.my.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fakesvc
            port:
              number: 8080

listen: 0.0.0.0:8080
metrics:
  enabled: true
  path: /metrics

endpoints:
  - name: echo
    type: ws/echo
    description: Basic WebSocket echo endpoint
    path: /ws/echo
  - name: time
    type: ws/stream
    description: Sends the current time every second
    path: /ws/time
    stream:
      interval: 1s
      format: json
  - name: Good endpoint
    type: http
    description: Fast enough, no errors at all
    path: /good
    chaos:
      error_rate: 0.0
      latency:
        min: 10ms
        p95: 50ms
        max: 100ms
  - name: Bad endpoint
    type: http
    description: 30% of requests fails with 500 error
    path: /bad
    chaos:
      error_rate: 0.3
      latency:
        min: 300ms
        p95: 3500ms
        max: 5s
  - name: Slow good endpoint
    type: http
    description: Always slow, but no errors
    path: /slow
    chaos:
      error_rate: 0.0
      latency:
        min: 1s
        p95: 5s
        max: 10s
  - path: /your-service
    type: http
    chaos:
      error_rate: 0.5
      latency:
        min: 1s
        p95: 5s
        max: 10s
